# Local Postgres that matches production. Start it, then set
#   DATABASE_URL=postgres://library:library@localhost:5432/library
# in your .env and run `python manage.py migrate`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
